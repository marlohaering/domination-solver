<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Domination Solver</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; color: #222; }
  #side { width: 320px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #ddd; }
  textarea { flex: 1; font-family: ui-monospace, monospace; font-size: 13px; resize: none; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button { padding: 6px 10px; cursor: pointer; }
  #solve { font-weight: bold; }
  input[type=number] { width: 60px; }
  #status { font-size: 14px; min-height: 3em; white-space: pre-wrap; }
  #canvas { flex: 1; }
  canvas { width: 100%; height: 100%; display: block; }
  small { color: #666; }
</style>
</head>
<body>
<div id="side">
  <h2 style="margin:0">Minimum Dominating Set</h2>
  <small>One edge per line (<code>a b</code>), a single name adds an isolated vertex. <code>#</code> starts a comment.</small>
  <textarea id="input" spellcheck="false"></textarea>
  <div class="row">
    <button id="ex1">Test graph</button>
    <button id="ex2">Petersen</button>
  </div>
  <div class="row">
    <button id="rand">Random</button>
    n <input id="rn" type="number" value="40" min="1">
    p <input id="rp" type="number" value="0.1" step="0.01" min="0" max="1">
  </div>
  <div class="row">
    <button id="solve">Solve</button>
    <button id="cancel" disabled>Cancel</button>
  </div>
  <div id="status"></div>
</div>
<div id="canvas"><canvas id="c"></canvas></div>
<script src="app.js"></script>
</body>
</html>
