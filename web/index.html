<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Domination Solver</title>
<style>
  :root {
    --bg: #07080d;
    --panel: rgba(20, 22, 34, 0.72);
    --panel-solid: #12141f;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #e8e9f1;
    --muted: #8b8fa7;
    --accent: #ff7a3d;
    --accent-2: #ff3d81;
    --cool: #5b8cff;
    --radius: 14px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 360px 1fr; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(900px 600px at 85% -10%, rgba(255, 61, 129, 0.14), transparent 60%),
      radial-gradient(800px 600px at 10% 110%, rgba(91, 140, 255, 0.14), transparent 60%),
      radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px) 0 0 / 24px 24px;
  }

  /* --- Sidebar ------------------------------------------------------------ */
  #side {
    height: 100vh; overflow-y: auto; padding: 22px 20px;
    display: flex; flex-direction: column; gap: 16px;
    background: var(--panel); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-right: 1px solid var(--border);
  }
  header { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 38px; height: 38px; flex: none; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 24px -6px rgba(255, 90, 90, 0.7);
  }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { margin: 0; color: var(--muted); font-size: 12.5px; }

  .card {
    background: rgba(255, 255, 255, 0.025); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  code { font-family: var(--mono); font-size: 11.5px; background: rgba(255, 255, 255, 0.07); padding: 1px 5px; border-radius: 5px; color: #ffb38f; }

  #graphcard { flex: 1 1 auto; min-height: 210px; }
  textarea {
    width: 100%; flex: 1; min-height: 110px; resize: none;
    font: 12.5px/1.55 var(--mono); color: var(--text);
    background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus, input:focus { border-color: rgba(255, 122, 61, 0.55); box-shadow: 0 0 0 3px rgba(255, 122, 61, 0.15); }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow > * { flex: 1; }

  button {
    font: inherit; font-size: 13px; font-weight: 550; color: var(--text); cursor: pointer;
    padding: 8px 12px; border-radius: 9px; border: 1px solid var(--border-strong);
    background: rgba(255, 255, 255, 0.04); transition: background .15s, border-color .15s, transform .08s, box-shadow .15s, opacity .15s;
  }
  button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.09); border-color: rgba(255, 255, 255, 0.26); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary {
    border: 0; padding: 11px 16px; font-size: 14px; font-weight: 650; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 28px -10px rgba(255, 70, 110, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  button.primary:hover:not(:disabled) { background: linear-gradient(135deg, #ff8a52, #ff5592); box-shadow: 0 10px 34px -8px rgba(255, 70, 110, 1), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
  button.primary.busy { background: linear-gradient(110deg, var(--accent) 20%, #ffb08a 40%, var(--accent-2) 60%); background-size: 250% 100%; animation: shimmer 1.4s linear infinite; opacity: 1; }
  @keyframes shimmer { to { background-position: -250% 0; } }

  .field { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-family: var(--mono); }
  input[type=number] {
    width: 68px; font: 12.5px var(--mono); color: var(--text); outline: none;
    background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px;
  }

  /* --- Results ------------------------------------------------------------ */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; }
  .stat b { display: block; font: 600 17px/1.2 var(--mono); }
  .stat span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .hero {
    display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(255, 122, 61, 0.14), rgba(255, 61, 129, 0.1));
    border: 1px solid rgba(255, 122, 61, 0.28);
  }
  .hero b {
    font: 700 34px/1 var(--mono);
    background: linear-gradient(135deg, #ffb08a, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero span { color: var(--muted); font-size: 12.5px; }
  .hero span em { font-style: normal; font-family: var(--mono); color: #c9cbe0; }
  #setlist { display: flex; flex-wrap: wrap; gap: 5px; max-height: 96px; overflow-y: auto; }
  .chip {
    font: 12px var(--mono); padding: 3px 8px; border-radius: 999px; color: #ffd2bd;
    background: rgba(255, 122, 61, 0.14); border: 1px solid rgba(255, 122, 61, 0.35);
  }
  #status { font-size: 12.5px; color: var(--muted); white-space: pre-wrap; min-height: 1.4em; }
  #status.err { color: #ff8a8a; }
  .spinner { display: inline-block; width: 11px; height: 11px; margin-right: 7px; vertical-align: -1px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); border-top-color: var(--accent); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }

  footer { margin-top: auto; color: var(--muted); font-size: 11.5px; opacity: 0.8; }

  /* --- Canvas ------------------------------------------------------------- */
  #canvas { position: relative; height: 100vh; min-width: 0; }
  canvas { width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute; display: flex; gap: 14px; align-items: center;
    padding: 8px 12px; border-radius: 10px; font-size: 12px; color: var(--muted);
    background: rgba(15, 17, 27, 0.7); border: 1px solid var(--border); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #legend { left: 16px; bottom: 16px; }
  #info { right: 16px; top: 16px; font-family: var(--mono); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .dot.set { background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 8px rgba(255, 90, 90, 0.8); }
  .dot.dom { background: #2a2030; border: 1.5px solid #ff9a6b; }
  .dot.plain { background: #1a1d2b; border: 1.5px solid #6c7393; }
  #relayout { position: absolute; right: 16px; bottom: 16px; background: rgba(15, 17, 27, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 820px) {
    body { display: block; height: auto; overflow: auto; }
    #side { height: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--border); }
    #graphcard { flex: none; }
    #canvas { height: 75vh; }
    textarea { flex: none; height: 160px; resize: vertical; }
    footer { display: none; }
  }
</style>
</head>
<body>
<aside id="side">
  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="12" x2="4.5" y2="5"/><line x1="12" y1="12" x2="19.5" y2="5"/><line x1="12" y1="12" x2="12" y2="21"/>
        <circle cx="12" cy="12" r="3.2" fill="#fff"/><circle cx="4.5" cy="5" r="2"/><circle cx="19.5" cy="5" r="2"/><circle cx="12" cy="21" r="2"/>
      </svg>
    </div>
    <div>
      <h1>Domination Solver</h1>
      <p class="sub">Exact minimum dominating sets, in your browser</p>
    </div>
  </header>

  <section class="card" id="graphcard">
    <div class="label">Graph <span id="counts"></span></div>
    <textarea id="input" spellcheck="false" aria-label="Edge list"></textarea>
    <p class="hint">One edge per line (<code>a b</code>). A single name adds an isolated vertex; <code>#</code> starts a comment.</p>
  </section>

  <section class="card">
    <div class="label">Examples</div>
    <div class="row grow">
      <button id="ex1">Test graph</button>
      <button id="ex2">Petersen</button>
    </div>
    <div class="row">
      <button id="rand">Random G(n,p)</button>
      <label class="field">n <input id="rn" type="number" value="40" min="1"></label>
      <label class="field">p <input id="rp" type="number" value="0.1" step="0.01" min="0" max="1"></label>
    </div>
  </section>

  <div class="row grow">
    <button id="solve" class="primary">Solve</button>
    <button id="cancel" disabled style="flex:0 0 auto">Cancel</button>
  </div>

  <section class="card" id="result" hidden>
    <div class="hero"><b id="gamma"></b><span>domination number <em>γ(G)</em></span></div>
    <div class="stats">
      <div class="stat"><b id="sv"></b><span>vertices</span></div>
      <div class="stat"><b id="se"></b><span>edges</span></div>
      <div class="stat"><b id="st"></b><span>time</span></div>
    </div>
    <div class="label">Dominating set</div>
    <div id="setlist"></div>
  </section>

  <div id="status"></div>

  <footer>Rust → WebAssembly · <span id="threads"></span></footer>
</aside>

<main id="canvas">
  <canvas id="c"></canvas>
  <div class="overlay" id="legend">
    <span><i class="dot set"></i>in set</span>
    <span><i class="dot dom"></i>dominated</span>
    <span><i class="dot plain"></i>vertex</span>
  </div>
  <div class="overlay" id="info"></div>
  <button id="relayout" title="Shuffle layout">↻ Re-layout</button>
</main>
<script src="app.js"></script>
</body>
</html>
